# ==========================================================
#  Logistics Microservice MVP — local calisma ortami
#  Altyapi (postgres, rabbitmq) ve uc .NET servisi. Servisler
#  depends_on ile altyapinin healthcheck'lerini bekler.
#
#  Calistirmak icin:  cp .env.example .env  &&  docker compose up -d
# ==========================================================

# Proje adi: container/volume/network on eki. Verilmezse klasor
# adi kullanilir — uzun ve okunaksiz olurdu.
name: smart-logistics

services:

  # ---------------------------------------------------------
  #  PostgreSQL — database-per-service (tek container, 3 ayri db)
  #  Uretimde her db ayri sunucuya tasinabilir; degisen tek sey
  #  servislerin ConnectionStrings degeri olur.
  # ---------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: sl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Entrypoint'in baglanacagi varsayilan db; servis db'leri
      # init script'inde ayrica olusturuluyor.
      POSTGRES_DB: postgres
      # init script bu degiskenleri okuyor:
      AUTH_DB: ${AUTH_DB}
      ORDER_DB: ${ORDER_DB}
      SHIPMENT_DB: ${SHIPMENT_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Sadece veri dizini BOSKEN calisir. Db listesi degisirse
      # "docker compose down -v" gerekir.
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ = compose interpolasyonundan kacis; degisken container
      # icinde cozulsun diye.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - logistics-net

  # ---------------------------------------------------------
  #  RabbitMQ — event broker (+ management UI)
  #  Exchange/queue burada TANIMLANMIYOR; MassTransit acilista declare eder.
  # ---------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management
    container_name: sl-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "${RABBITMQ_PORT}:5672"            # amqp
      - "${RABBITMQ_MANAGEMENT_PORT}:15672" # web arayuz
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      # RabbitMQ acilisi yavas; erken "unhealthy" damgasi yememesi icin.
      start_period: 40s
    networks:
      - logistics-net

  # ---------------------------------------------------------
  #  Auth Service — kimlik ve token uretimi
  #  Bu blok diger servislere sablon: degisen sadece isim,
  #  port ve database. Auth broker'a BAGLANMAZ (event yayinlamaz).
  # ---------------------------------------------------------
  auth-service:
    build:
      # Context REPO KOKU: servis, src/BuildingBlocks/* projelerine
      # referans veriyor ve Docker context disini kopyalayamaz.
      context: .
      dockerfile: src/services/AuthService/AuthService.Api/Dockerfile
    container_name: sl-auth
    restart: unless-stopped
    depends_on:
      postgres:
        # Sadece "baslamis" degil, healthcheck'i GECMIS olmasini bekler.
        # depends_on tek basina sirayi belirler, hazir olmayi degil.
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      # .NET'te "ConnectionStrings:AuthDb" ayari, ortam degiskeninde
      # "__" ile yazilir (Linux env adinda ":" gecersiz).
      # Sir appsettings.json'da DEGIL, .env'den geliyor.
      ConnectionStrings__AuthDb: "Host=${POSTGRES_HOST};Port=5432;Database=${AUTH_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # JWT ayarlari da ayni yoldan: sir .env'de, koda gomulu degil.
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
      # Seed kullanicilarinin sifreleri de koda gomulu degil.
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      Seed__DefaultPassword: ${SEED_DEFAULT_PASSWORD}
    ports:
      # Disaridan 8081, container icinde 8080 (ASP.NET 8+ varsayilani).
      - "${AUTH_SERVICE_PORT}:8080"
    healthcheck:
      # LIVENESS kullaniliyor, readiness degil: Postgres bir an dusunce
      # container restart edilmemeli.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - logistics-net

  # ---------------------------------------------------------
  #  Order Service — YAYINCI
  #  Auth'tan farki: kendi database'i, kendi portu ve RabbitMQ'ya
  #  baglanmasi. OrderCreated event'ini outbox uzerinden yayinlar.
  # ---------------------------------------------------------
  order-service:
    build:
      context: .
      dockerfile: src/services/OrderService/OrderService.Api/Dockerfile
    container_name: sl-order
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        # Event yayinlayacagi icin broker'in da hazir olmasini bekler.
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__OrderDb: "Host=${POSTGRES_HOST};Port=5432;Database=${ORDER_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # AYNI Jwt anahtari: Auth'un urettigi token'i bu servis dogrulayabilsin diye.
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
      RabbitMq__Host: ${RABBITMQ_HOST}
      RabbitMq__Port: ${RABBITMQ_PORT}
      RabbitMq__Username: ${RABBITMQ_USERNAME}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST}
    ports:
      - "${ORDER_SERVICE_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - logistics-net

  # ---------------------------------------------------------
  #  Shipment Service — TUKETICI + YAYINCI
  #  OrderCreated'i dinler (inbox ile idempotent), gonderi olusturur,
  #  ShipmentCreated yayinlar. Kuyrugunu acilista kendisi declare eder.
  # ---------------------------------------------------------
  shipment-service:
    build:
      context: .
      dockerfile: src/services/ShipmentService/ShipmentService.Api/Dockerfile
    container_name: sl-shipment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__ShipmentDb: "Host=${POSTGRES_HOST};Port=5432;Database=${SHIPMENT_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # AYNI Jwt anahtari: Auth'un urettigi token'i bu servis de dogrulayabilsin diye.
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
      RabbitMq__Host: ${RABBITMQ_HOST}
      RabbitMq__Port: ${RABBITMQ_PORT}
      RabbitMq__Username: ${RABBITMQ_USERNAME}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST}
    ports:
      - "${SHIPMENT_SERVICE_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - logistics-net

# Named volume: Docker yonetir. Bind mount degil — Windows'ta
# dosya izni/performans derdi cikarmaz.
volumes:
  postgres-data:
  rabbitmq-data:

networks:
  logistics-net:
    driver: bridge
